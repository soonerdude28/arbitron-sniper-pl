<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OddsJam Pro Desk</title>
<style>
:root { --bg:#0b0f14; --card:#151c27; --border:#243044; --text:#e8eef6; --muted:#8b9bb4; --green:#00d4aa; --red:#ff5c5c; --blue:#4da6ff; --accent:#7c5cff; --yellow:#ffb35c; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; padding:16px; max-width:1400px; margin:0 auto; }
.header { text-align:center; margin-bottom:20px; }
.header h1 { font-size:1.9rem; font-weight:700; }
.sub { color:var(--muted); font-size:.9rem; }
.kpi-strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
.kpi-card { background:linear-gradient(180deg,#1a2332 0%,#121820 100%); border:1px solid var(--border); border-radius:12px; padding:14px; }
.kpi-title { color:var(--muted); font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; }
.kpi-main { font-size:1.35rem; font-weight:700; }
.tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.tab { background:var(--card); border:1px solid var(--border); color:var(--text); padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:500; }
.tab.active { background:var(--accent); border-color:var(--accent); }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
textarea, input, select { width:100%; background:#0e141c; border:1px solid var(--border); color:var(--text); border-radius:6px; padding:8px; font-family:inherit; }
button { background:var(--accent); color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-weight:600; margin-right:6px; }
button.secondary { background:#243044; }
button.danger { background:var(--red); }
button.success { background:var(--green); color:#0b0f14; }
.positive { color:var(--green); } .negative { color:var(--red); }
.hidden { display:none; }
.signal-card, .trade-row { background:#1a2332; border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px; }
.meta { color:var(--muted); font-size:.85rem; }
.actions { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="header">
  <h1>OddsJam Pro Desk</h1>
  <div class="sub">Signal board • Risk sizing • Full trade journal • Local only • No auto-execution</div>
</div>
<div class="kpi-strip">
  <div class="kpi-card"><div class="kpi-title">Bankroll</div><div class="kpi-main" id="kpi-bank">$2,500</div></div>
  <div class="kpi-card"><div class="kpi-title">Realized P/L</div><div class="kpi-main" id="kpi-realized">$0</div></div>
  <div class="kpi-card"><div class="kpi-title">Open Staked</div><div class="kpi-main" id="kpi-open">$0</div></div>
  <div class="kpi-card"><div class="kpi-title">Trades</div><div class="kpi-main" id="kpi-trades">0</div></div>
</div>
<div class="tabs">
  <div class="tab active" data-tab="signals">Signals</div>
  <div class="tab" data-tab="trades">Trades & Bets</div>
  <div class="tab" data-tab="risk">Risk</div>
</div>

<div id="tab-signals" class="tab-content">
  <div class="card">
    <h2>Paste OddsJam Table</h2>
    <textarea id="paste" placeholder="Paste markdown table from OddsJam Prediction Traders or +EV..."></textarea>
    <div style="margin-top:10px;">
      <button onclick="parsePaste()">Parse & Add</button>
      <button class="secondary" onclick="loadSampleSignals()">Example</button>
      <button class="secondary" onclick="clearSignals()">Clear</button>
    </div>
  </div>
  <div id="signalBoard"></div>
</div>

<div id="tab-trades" class="tab-content hidden">
  <div class="card">
    <h2>Log a Trade / Bet</h2>
    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px;">
      <input id="t-venue" placeholder="Venue (Waves, Polymarket...)">
      <input id="t-event" placeholder="Event / Market">
      <input id="t-side" placeholder="Side / Selection">
      <input id="t-odds" placeholder="Odds / Price (e.g. +110 or 68¢)">
      <input id="t-stake" type="number" placeholder="Stake $">
      <select id="t-status"><option value="open">Open</option><option value="won">Won</option><option value="lost">Lost</option></select>
    </div>
    <button style="margin-top:10px;" onclick="addTrade()">Add Trade</button>
    <button class="secondary" onclick="exportTrades()">Export JSON</button>
    <button class="secondary" onclick="document.getElementById('importFile').click()">Import JSON</button>
    <input type="file" id="importFile" style="display:none" accept=".json" onchange="importTrades(this)">
  </div>
  <div id="tradesList"></div>
</div>

<div id="tab-risk" class="tab-content hidden">
  <div class="card">
    <h2>Risk Settings</h2>
    <label>Bankroll</label><input type="number" id="bankroll" value="2500" onchange="saveSettings()">
    <label>Fractional Kelly</label><input type="number" id="kelly" value="0.25" step="0.05" onchange="saveSettings()">
    <label>Daily Max Loss</label><input type="number" id="dailyMax" value="150" onchange="saveSettings()">
    <p class="meta" style="margin-top:12px;">All data stays in your browser. Export regularly for backup.</p>
  </div>
</div>

<script>
let signals = JSON.parse(localStorage.getItem('ojSignals')||'[]');
let trades = JSON.parse(localStorage.getItem('ojTrades')||'[]');
let settings = JSON.parse(localStorage.getItem('ojSettings')||'{"bankroll":2500,"kelly":0.25,"dailyMax":150}');

function saveAll() {
  localStorage.setItem('ojSignals', JSON.stringify(signals));
  localStorage.setItem('ojTrades', JSON.stringify(trades));
  localStorage.setItem('ojSettings', JSON.stringify(settings));
  updateKPIs();
}

function updateKPIs() {
  const realized = trades.filter(t=>t.status!=='open').reduce((s,t)=>s+(t.pnl||0),0);
  const open = trades.filter(t=>t.status==='open').reduce((s,t)=>s+(t.stake||0),0);
  document.getElementById('kpi-bank').textContent = '$'+(settings.bankroll||2500).toLocaleString();
  document.getElementById('kpi-realized').textContent = (realized>=0?'+':'')+'$'+realized.toFixed(2);
  document.getElementById('kpi-realized').className = 'kpi-main '+(realized>=0?'positive':'negative');
  document.getElementById('kpi-open').textContent = '$'+open.toFixed(2);
  document.getElementById('kpi-trades').textContent = trades.length;
}

function parsePaste() {
  const text = document.getElementById('paste').value;
  if (!text.includes('|')) { alert('No table found'); return; }
  const lines = text.split('\n').filter(l=>l.includes('|') && !l.includes('---'));
  lines.slice(1).forEach((line,i) => {
    const c = line.split('|').map(x=>x.trim()).filter(Boolean);
    if (c.length>=2) signals.push({id:Date.now()+i, event:c[0], side:c[1]||'', price:c[2]||'', score:85, staged:false});
  });
  document.getElementById('paste').value='';
  saveAll(); renderSignals();
}

function loadSampleSignals() {
  signals = [
    {id:1, event:'NBA Trail Blazers vs Jazz', side:'Portland ML', price:'68¢', score:88, staged:false},
    {id:2, event:'NFL Commanders vs Eagles', side:'Commanders -3.5', price:'58¢', score:82, staged:false}
  ];
  saveAll(); renderSignals();
}

function clearSignals() { signals=[]; saveAll(); renderSignals(); }

function renderSignals() {
  const board = document.getElementById('signalBoard');
  board.innerHTML = signals.map(s=>`
    <div class="signal-card">
      <strong>${s.event}</strong> <span class="meta">${s.side} @ ${s.price} • ${s.score}</span>
      <div class="actions">
        <button onclick="logFromSignal(${s.id})">Log as Trade</button>
      </div>
    </div>`).join('') || '<p class="meta">No signals. Paste a table or load example.</p>';
}

function logFromSignal(id) {
  const s = signals.find(x=>x.id===id);
  if (!s) return;
  trades.push({
    id: Date.now(),
    venue: 'Polymarket',
    event: s.event,
    side: s.side,
    odds: s.price,
    stake: 25,
    status: 'open',
    pnl: 0,
    date: new Date().toISOString().slice(0,10)
  });
  saveAll(); renderTrades();
  alert('Logged as open trade');
}

function addTrade() {
  const t = {
    id: Date.now(),
    venue: document.getElementById('t-venue').value || 'Unknown',
    event: document.getElementById('t-event').value || 'Unknown',
    side: document.getElementById('t-side').value || '',
    odds: document.getElementById('t-odds').value || '',
    stake: parseFloat(document.getElementById('t-stake').value)||0,
    status: document.getElementById('t-status').value,
    pnl: 0,
    date: new Date().toISOString().slice(0,10)
  };
  if (t.status==='won') t.pnl = t.stake * 0.9;
  if (t.status==='lost') t.pnl = -t.stake;
  trades.push(t);
  saveAll(); renderTrades();
  ['t-venue','t-event','t-side','t-odds','t-stake'].forEach(id=>document.getElementById(id).value='');
}

function settle(id, status) {
  const t = trades.find(x=>x.id===id);
  if (!t) return;
  t.status = status;
  t.pnl = status==='won' ? t.stake * 0.85 : (status==='lost' ? -t.stake : 0);
  saveAll(); renderTrades();
}

function renderTrades() {
  const list = document.getElementById('tradesList');
  list.innerHTML = trades.slice().reverse().map(t=>`
    <div class="trade-row">
      <div><strong>${t.event}</strong> <span class="meta">${t.side} @ ${t.odds} • ${t.venue} • $${t.stake}</span></div>
      <div class="meta">${t.date} • ${t.status.toUpperCase()} ${t.pnl ? (t.pnl>=0?'+':'')+t.pnl.toFixed(2) : ''}</div>
      ${t.status==='open' ? `<div class="actions"><button class="success" onclick="settle(${t.id},'won')">Won</button><button class="danger" onclick="settle(${t.id},'lost')">Lost</button></div>` : ''}
    </div>`).join('') || '<p class="meta">No trades yet. Log one above or from a signal.</p>';
}

function exportTrades() {
  const blob = new Blob([JSON.stringify({trades,signals,settings},null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'oddsjam-desk-backup.json';
  a.click();
}

function importTrades(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.trades) trades = data.trades;
      if (data.signals) signals = data.signals;
      if (data.settings) settings = data.settings;
      saveAll(); renderSignals(); renderTrades();
      alert('Imported');
    } catch(err) { alert('Bad file'); }
  };
  reader.readAsText(file);
}

function saveSettings() {
  settings.bankroll = parseFloat(document.getElementById('bankroll').value)||2500;
  settings.kelly = parseFloat(document.getElementById('kelly').value)||0.25;
  settings.dailyMax = parseFloat(document.getElementById('dailyMax').value)||150;
  saveAll();
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.add('hidden'));
    tab.classList.add('active');
    document.getElementById('tab-'+tab.dataset.tab).classList.remove('hidden');
  };
});

// init
document.getElementById('bankroll').value = settings.bankroll;
updateKPIs(); renderSignals(); renderTrades();
</script>
</body>
</html>
