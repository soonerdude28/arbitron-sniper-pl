<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OddsJam Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0c;
      --fg: #f3f3f4;
      --muted: #9a9aa3;
      --faint: #6c6c75;
      --line: #2c2c31;
      --up: #8fbfa8;
      --down: #e08b8b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    }
    main { max-width: 72rem; margin: 0 auto; padding: 1.25rem 1.25rem 5rem; }
    header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 2rem; }
    .kicker { margin: 0; font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
    h1 { margin: 0.2rem 0 0; font-family: Newsreader, Georgia, serif; font-weight: 500; font-size: clamp(2.5rem, 6vw, 3.25rem); line-height: 0.95; letter-spacing: -0.03em; }
    .meta { color: var(--muted); font-size: 0.875rem; }
    .stats { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr 1fr; }
    @media (min-width: 900px) {
      .stats { grid-template-columns: 1.3fr 1fr 1fr 1fr; }
      .stats > div + div { border-left: 1px solid var(--line); }
    }
    .stat { padding: 1rem 0.25rem; }
    @media (min-width: 640px) { .stat { padding: 1rem; } }
    .stat p { margin: 0; }
    .label { font-size: 0.75rem; color: var(--faint); }
    .value { margin-top: 0.25rem; font-variant-numeric: tabular-nums; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 1.25rem; }
    .value.hero { font-family: Newsreader, Georgia, serif; font-size: clamp(2rem, 4vw, 2.5rem); letter-spacing: -0.03em; }
    .hint { margin-top: 0.25rem; font-size: 0.75rem; color: var(--muted); }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .cap { display: flex; align-items: center; gap: 1rem; border-bottom: 1px solid var(--line); padding: 0.75rem 0.25rem 0.9rem; }
    .cap span { font-size: 0.75rem; color: var(--faint); width: 4.5rem; }
    .track { flex: 1; height: 1px; background: var(--line); }
    .fill { height: 1px; background: var(--fg); }
    .cap b { font-weight: 500; font-variant-numeric: tabular-nums; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.75rem; color: var(--muted); width: 7rem; text-align: right; }
    .layout { display: grid; gap: 2.5rem; margin-top: 2rem; }
    @media (min-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr) 16rem; align-items: start; } }
    h2 { margin: 0 0 0.75rem; font-size: 0.875rem; font-weight: 500; }
    .scroll { overflow-x: auto; }
    table { width: 100%; min-width: 640px; border-collapse: collapse; text-align: left; font-size: 0.875rem; }
    th { font-size: 0.75rem; font-weight: 500; color: var(--faint); padding: 0.5rem 0.75rem 0.5rem 0; border-bottom: 1px solid var(--line); }
    td { padding: 0.65rem 0.75rem 0.65rem 0; border-bottom: 1px solid var(--line); vertical-align: top; }
    .num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; text-align: right; }
    .sub { display: block; color: var(--muted); font-size: 0.75rem; margin-top: 0.15rem; }
    .cash { font-family: Newsreader, Georgia, serif; font-size: 1.75rem; margin: 0 0 1rem; }
    .books { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .books li { display: flex; justify-content: space-between; gap: 1rem; padding: 0.65rem 0; border-bottom: 1px solid var(--line); font-size: 0.875rem; }
    .note { margin-top: 1rem; font-size: 0.75rem; line-height: 1.5; color: var(--faint); }
    .err { color: var(--down); }
    @media (max-width: 700px) {
      table { display: none; }
      .cards { display: block; }
    }
    .cards { display: none; border-top: 1px solid var(--line); }
    .card { padding: 0.75rem 0; border-bottom: 1px solid var(--line); }
    .card .row { display: flex; justify-content: space-between; gap: 0.75rem; }
    .card .row p { margin: 0; min-width: 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="kicker">OddsJam desk</p>
        <h1>Book</h1>
      </div>
      <p class="meta" id="asof">Loading ledger</p>
    </header>
    <section class="stats" id="stats"></section>
    <div class="cap" id="cap"></div>
    <div class="layout">
      <section>
        <h2>Open positions</h2>
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>Bot</th>
                <th>Venue</th>
                <th>Market</th>
                <th class="num">Stake</th>
                <th>Price</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="cards" id="cards"></div>
      </section>
      <aside>
        <h2>Cash on hand</h2>
        <p class="cash num" id="cash" style="text-align:left">—</p>
        <ul class="books" id="books"></ul>
        <p class="note" id="note"></p>
      </aside>
    </div>
  </main>
  <script>
    const money = (n, signed) => {
      const v = Number(n) || 0;
      const body = Math.abs(v).toLocaleString("en-US", { style: "currency", currency: "USD" });
      if (signed && v > 0) return "+" + body;
      if (v < 0) return "-" + body;
      return body;
    };
    const tone = (n) => (n > 0.004 ? "up" : n < -0.004 ? "down" : "");
    const esc = (s) => String(s ?? "")
      .replace(/&/g, "&" + "amp;")
      .replace(/</g, "&" + "lt;")
      .replace(/>/g, "&" + "gt;")
      .replace(/"/g, "&" + "quot;");

    function stat(label, value, hint, cls, hero) {
      return `<div class="stat"><p class="label">${label}</p><p class="value ${hero ? "hero" : ""} ${cls}">${value}</p><p class="hint">${hint}</p></div>`;
    }

    function render(data) {
      const d = data.desk || {};
      const sniper = data.sniper || {};
      const arb = data.arbitron || {};
      const open = (sniper.open || []).slice().sort((a, b) => (b.stake || 0) - (a.stake || 0));
      document.getElementById("asof").textContent = data.as_of || "";
      document.getElementById("stats").innerHTML = [
        stat("Realized", money(d.realized_pnl, true), "Both books", tone(d.realized_pnl), true),
        stat("Arbitron", money(d.arbitron_realized, true), `${arb.wins ?? 0}–${arb.losses ?? 0} settled`, tone(d.arbitron_realized)),
        stat("Sniper", money(d.sniper_realized, true), `${sniper.wins ?? 0}–${sniper.losses ?? 0} settled`, tone(d.sniper_realized)),
        stat("Open", money(d.open_staked), `${d.open_positions ?? open.length} positions · ${money(d.open_profit, true)} if cashed`, ""),
      ].join("");
      const bankroll = (Number(d.free_cash) || 0) + (Number(d.open_staked) || 0);
      let arbOpen = 0;
      for (const g of arb.groups || []) {
        for (const t of g.tickets || []) {
          if ((t.status || "open") === "open") arbOpen += Number(t.stake) || 0;
        }
      }
      const capPct = bankroll ? (arbOpen / bankroll) * 100 : 0;
      document.getElementById("cap").innerHTML = `<span>Arb cap</span><div class="track"><div class="fill" style="width:${Math.min(100, capPct)}%"></div></div><b>${capPct.toFixed(1)}% / 15%</b>`;
      const row = (t) => `<tr><td>Sniper</td><td>${esc(t.exchange)}</td><td>${esc(t.market)}<span class="sub">${esc(t.side)}</span></td><td class="num">${money(t.stake)}</td><td>${esc(t.entry || "—")}</td></tr>`;
      const card = (t) => `<article class="card"><div class="row"><p>${esc(t.market)}</p><p class="num">${money(t.stake)}</p></div><p class="sub">${esc(t.exchange)} · ${esc(t.side)}${t.entry ? " · " + esc(t.entry) : ""}</p></article>`;
      document.getElementById("rows").innerHTML = open.map(row).join("") || `<tr><td colspan="5">No open positions.</td></tr>`;
      document.getElementById("cards").innerHTML = open.map(card).join("");
      const books = ((data.balances || {}).books || []).filter((b) => Number(b.cash) > 0);
      const total = books.reduce((s, b) => s + Number(b.cash || 0), 0);
      document.getElementById("cash").textContent = money(total || d.free_cash);
      document.getElementById("books").innerHTML = books.map((b) => {
        const name = String(b.book).replace(/ \(.*$/, "");
        return `<li><span>${esc(name)}</span><span class="num" style="text-align:right">${money(b.cash)}</span></li>`;
      }).join("");
      document.getElementById("note").textContent = "Sniper is analyze-only. Arbitron is exchange-arb inside OddsJam. This page does not send bets. Ledger " + (data.as_of || "") + ".";
    }

    fetch("./data.json", { cache: "no-store" })
      .then((r) => { if (!r.ok) throw new Error("ledger " + r.status); return r.json(); })
      .then(render)
      .catch((err) => { document.getElementById("asof").textContent = ""; document.getElementById("stats").innerHTML = `<p class="err">${esc(err.message)}</p>`; });
  </script>
</body>
</html>
