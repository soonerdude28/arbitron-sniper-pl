<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OddsJam Pro Desk</title>
<style>
:root { --bg:#0b0f14; --card:#151b24; --border:#243040; --text:#e8eef6; --muted:#8a9bb0; --green:#00c48c; --red:#ff5a5f; --blue:#4d9fff; --accent:#7c5cff; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--text); padding:16px; line-height:1.4; }
.header { text-align:center; margin-bottom:20px; }
.header h1 { font-size:1.6rem; font-weight:700; }
.sub { color:var(--muted); font-size:.85rem; }
.tabs { display:flex; gap:8px; justify-content:center; margin:12px 0 20px; flex-wrap:wrap; }
.tab { background:var(--card); border:1px solid var(--border); color:var(--text); padding:8px 16px; border-radius:8px; cursor:pointer; font-size:.9rem; }
.tab.active { background:var(--accent); border-color:var(--accent); }
.panel { display:none; max-width:1200px; margin:0 auto; }
.panel.active { display:block; }
.kpi { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
.kpi-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; }
.kpi-title { color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; }
.kpi-val { font-size:1.3rem; font-weight:700; margin-top:4px; }
.positive { color:var(--green); } .negative { color:var(--red); }
.card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
h2 { font-size:1.1rem; margin-bottom:10px; }
textarea, input, select, button { background:#0f141c; border:1px solid var(--border); color:var(--text); padding:8px; border-radius:6px; font-size:.9rem; width:100%; }
button { background:var(--accent); border:none; cursor:pointer; font-weight:600; width:auto; padding:8px 14px; }
button.secondary { background:#243040; }
table { width:100%; border-collapse:collapse; font-size:.82rem; }
th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--border); }
th { color:var(--muted); font-weight:500; }
.row-actions button { padding:4px 8px; font-size:.75rem; margin-right:4px; }
.filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.filters select, .filters input { width:auto; min-width:120px; }
</style>
</head>
<body>
<div class="header">
  <h1>OddsJam Pro Desk</h1>
  <div class="sub">Signal board · Risk sizing · Full trade journal · Local only</div>
</div>
<div class="tabs">
  <div class="tab active" data-tab="signals">Signals</div>
  <div class="tab" data-tab="trades">Trades & Bets</div>
  <div class="tab" data-tab="risk">Risk</div>
</div>

<div id="signals" class="panel active">
  <div class="card">
    <h2>Paste OddsJam Table</h2>
    <textarea id="paste" rows="6" placeholder="Paste markdown table from Prediction Traders or +EV here..."></textarea>
    <div style="margin-top:8px; display:flex; gap:8px;">
      <button onclick="parsePaste()">Parse & Add</button>
      <button class="secondary" onclick="loadExample()">Load Example</button>
    </div>
  </div>
  <div class="kpi" id="signalKpis"></div>
  <div class="card">
    <div class="filters">
      <select id="sigFilter"><option value="all">All sources</option><option value="pt">Prediction Traders</option><option value="ev">+EV</option></select>
      <input type="number" id="minConf" placeholder="Min score" value="70" style="width:100px;">
    </div>
    <table id="signalTable"><thead><tr><th>Score</th><th>Event</th><th>Side</th><th>Price</th><th>Size</th><th></th></tr></thead><tbody></tbody></table>
  </div>
</div>

<div id="trades" class="panel">
  <div class="kpi" id="tradeKpis"></div>
  <div class="card">
    <h2>Log Trade</h2>
    <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px;">
      <input id="tVenue" placeholder="Venue (Waves, Kalshi...)">
      <input id="tSport" placeholder="Sport">
      <input id="tEvent" placeholder="Event / Market">
      <input id="tSide" placeholder="Side">
      <input id="tOdds" placeholder="Odds / Price">
      <input id="tStake" type="number" placeholder="Stake" step="0.01">
      <select id="tStatus"><option>open</option><option>won</option><option>lost</option><option>void</option></select>
    </div>
    <div style="margin-top:8px;"><button onclick="addTrade()">Add Trade</button></div>
  </div>
  <div class="card">
    <div class="filters">
      <select id="statusFilter"><option value="all">All</option><option value="open">Open</option><option value="won">Won</option><option value="lost">Lost</option></select>
      <button class="secondary" onclick="exportTrades()">Export JSON</button>
      <button class="secondary" onclick="document.getElementById('importFile').click()">Import JSON</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importTrades(event)">
    </div>
    <table id="tradeTable"><thead><tr><th>Date</th><th>Venue</th><th>Market</th><th>Side</th><th>Stake</th><th>Odds</th><th>Status</th><th>P/L</th><th></th></tr></thead><tbody></tbody></table>
  </div>
</div>

<div id="risk" class="panel">
  <div class="card">
    <h2>Risk Settings</h2>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <div><label>Bankroll</label><input type="number" id="bankroll" value="2500"></div>
      <div><label>Kelly Fraction</label><select id="kelly"><option value="0.25">Quarter</option><option value="0.5">Half</option><option value="0.1">Tenth</option></select></div>
      <div><label>Daily Max Loss</label><input type="number" id="dailyLoss" value="150"></div>
      <div><label>Used Today</label><input type="number" id="dailyUsed" value="0"></div>
    </div>
    <button style="margin-top:12px;" onclick="saveRisk()">Save</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let signals = JSON.parse(localStorage.getItem('oj_signals') || '[]');
let trades = JSON.parse(localStorage.getItem('oj_trades') || '[]');
let risk = JSON.parse(localStorage.getItem('oj_risk') || '{"bankroll":2500,"kelly":0.25,"dailyLoss":150,"dailyUsed":0}');

function saveAll() {
  localStorage.setItem('oj_signals', JSON.stringify(signals));
  localStorage.setItem('oj_trades', JSON.stringify(trades));
  localStorage.setItem('oj_risk', JSON.stringify(risk));
}

function loadExample() {
  const ex = `Score | Event | Side | Price | Confidence\n87 | NBA Pacers vs Heat | Miami Heat ML | 67¢ | 0.87\n81 | NFL Falcons/Bucs | Over 44.5 | -110 | 0.81\n75 | NBA Mavericks ML | Mavericks | 40¢ | 0.75`;
  $('#paste').value = ex;
  parsePaste();
}

function parsePaste() {
  const text = $('#paste').value.trim();
  if (!text) return;
  const lines = text.split('\\n').filter(l => l.trim());
  if (lines.length < 2) return;
  const headers = lines[0].split('|').map(h => h.trim().toLowerCase());
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split('|').map(c => c.trim());
    if (cols.length < 3) continue;
    const sig = {
      id: Date.now() + i,
      score: parseFloat(cols[0]) || 0,
      event: cols[1] || '',
      side: cols[2] || '',
      price: cols[3] || '',
      source: 'paste'
    };
    signals.push(sig);
  }
  saveAll();
  renderSignals();
  $('#paste').value = '';
}

function renderSignals() {
  const min = parseFloat($('#minConf').value) || 0;
  const tbody = $('#signalTable tbody');
  tbody.innerHTML = '';
  const filtered = signals.filter(s => s.score >= min);
  filtered.forEach(s => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${s.score}</td><td>${s.event}</td><td>${s.side}</td><td>${s.price}</td><td>—</td>
      <td class="row-actions"><button onclick="logFromSignal(${s.id})">Log</button><button class="secondary" onclick="removeSignal(${s.id})">×</button></td>`;
    tbody.appendChild(tr);
  });
  $('#signalKpis').innerHTML = `<div class="kpi-card"><div class="kpi-title">Signals</div><div class="kpi-val">${filtered.length}</div></div>`;
}

function removeSignal(id) { signals = signals.filter(s => s.id !== id); saveAll(); renderSignals(); }

function logFromSignal(id) {
  const s = signals.find(x => x.id === id);
  if (!s) return;
  $('#tEvent').value = s.event;
  $('#tSide').value = s.side;
  $('#tOdds').value = s.price;
  document.querySelector('[data-tab="trades"]').click();
}

function addTrade() {
  const t = {
    id: Date.now(),
    date: new Date().toISOString().slice(0,10),
    venue: $('#tVenue').value || 'Unknown',
    sport: $('#tSport').value || '',
    event: $('#tEvent').value || '',
    side: $('#tSide').value || '',
    odds: $('#tOdds').value || '',
    stake: parseFloat($('#tStake').value) || 0,
    status: $('#tStatus').value,
    pnl: 0
  };
  if (t.status === 'won') t.pnl = calcPayout(t.odds, t.stake) - t.stake;
  if (t.status === 'lost') t.pnl = -t.stake;
  trades.push(t);
  saveAll();
  renderTrades();
  ['tVenue','tSport','tEvent','tSide','tOdds','tStake'].forEach(id => $('#'+id).value = '');
}

function calcPayout(odds, stake) {
  if (!odds) return stake;
  if (odds.includes('¢') || odds.includes('c')) {
    const p = parseFloat(odds) / 100;
    return stake / p;
  }
  const n = parseFloat(odds);
  if (n > 0) return stake * (n/100 + 1);
  if (n < 0) return stake * (1 + 100/Math.abs(n));
  return stake;
}

function renderTrades() {
  const filter = $('#statusFilter').value;
  const tbody = $('#tradeTable tbody');
  tbody.innerHTML = '';
  const list = filter === 'all' ? trades : trades.filter(t => t.status === filter);
  let realized = 0, openStake = 0;
  list.forEach(t => {
    if (t.status !== 'open') realized += t.pnl || 0;
    if (t.status === 'open') openStake += t.stake;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${t.date}</td><td>${t.venue}</td><td>${t.event}</td><td>${t.side}</td><td>$${t.stake.toFixed(2)}</td><td>${t.odds}</td><td>${t.status}</td><td class="${(t.pnl||0)>=0?'positive':'negative'}">${t.pnl>=0?'+':''}${(t.pnl||0).toFixed(2)}</td>
      <td class="row-actions">${t.status==='open'?`<button onclick="settle(${t.id},'won')">Won</button><button onclick="settle(${t.id},'lost')">Lost</button>`:''}<button class="secondary" onclick="removeTrade(${t.id})">×</button></td>`;
    tbody.appendChild(tr);
  });
  $('#tradeKpis').innerHTML = `
    <div class="kpi-card"><div class="kpi-title">Realized</div><div class="kpi-val ${realized>=0?'positive':'negative'}">${realized>=0?'+':''}$${realized.toFixed(2)}</div></div>
    <div class="kpi-card"><div class="kpi-title">Open Staked</div><div class="kpi-val">$${openStake.toFixed(2)}</div></div>
    <div class="kpi-card"><div class="kpi-title">Trades</div><div class="kpi-val">${list.length}</div></div>`;
}

function settle(id, status) {
  const t = trades.find(x => x.id === id);
  if (!t) return;
  t.status = status;
  if (status === 'won') t.pnl = calcPayout(t.odds, t.stake) - t.stake;
  if (status === 'lost') t.pnl = -t.stake;
  saveAll(); renderTrades();
}

function removeTrade(id) { trades = trades.filter(t => t.id !== id); saveAll(); renderTrades(); }

function exportTrades() {
  const blob = new Blob([JSON.stringify(trades, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'oddsjam-trades.json';
  a.click();
}

function importTrades(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (Array.isArray(data)) { trades = data; saveAll(); renderTrades(); }
    } catch(err) { alert('Invalid JSON'); }
  };
  reader.readAsText(file);
}

function saveRisk() {
  risk.bankroll = parseFloat($('#bankroll').value) || 0;
  risk.kelly = parseFloat($('#kelly').value);
  risk.dailyLoss = parseFloat($('#dailyLoss').value) || 0;
  risk.dailyUsed = parseFloat($('#dailyUsed').value) || 0;
  saveAll();
  alert('Saved');
}

$$('.tab').forEach(tab => tab.onclick = () => {
  $$('.tab').forEach(t => t.classList.remove('active'));
  $$('.panel').forEach(p => p.classList.remove('active'));
  tab.classList.add('active');
  $('#'+tab.dataset.tab).classList.add('active');
});

$('#minConf').oninput = renderSignals;
$('#statusFilter').onchange = renderTrades;

if (trades.length === 0) {
  trades = [
    {id:1, date:'2026-10-30', venue:'Waves', sport:'NBA', event:'Spurs @ Jazz', side:'Jazz +13.5', odds:'+120', stake:25, status:'won', pnl:55},
    {id:2, date:'2026-10-30', venue:'ProphetX', sport:'NBA', event:'Heat vs Hawks', side:'Heat', odds:'67¢', stake:8, status:'won', pnl:2.96},
    {id:3, date:'2026-10-31', venue:'Polymarket', sport:'NBA', event:'Blazers vs Jazz', side:'Blazers ML', odds:'68¢', stake:4.87, status:'open', pnl:0}
  ];
  saveAll();
}

renderSignals();
renderTrades();
</script>
</body>
</html>
